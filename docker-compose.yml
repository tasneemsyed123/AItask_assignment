# docker-compose.yml
# ------------------------------------------------------------------------
# INFRA ONLY for local development - runs MongoDB + Redis so you don't need
# to install them on your machine. The application itself (backend, worker,
# frontend) is intentionally NOT containerized here - that is Phase 2 scope
# (Docker images for the app + Kubernetes + Argo CD + CI/CD).
#
# Usage: docker compose up -d
# Then run backend/worker/frontend locally with `npm run dev` / `python -m app.main`.
services:
  mongo:
    image: mongo:7
    container_name: ai_task_platform_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ai_task_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
