# docker-compose.yml
# ------------------------------------------------------------------------
# INFRA ONLY for local development - runs MongoDB + Redis so you don't need
# to install them on your machine. The application itself (backend, worker,
# frontend) is intentionally NOT containerized here - that is Phase 2 scope
# (Docker images for the app + Kubernetes + Argo CD + CI/CD).
#
# Both services require auth (credentials come from a root-level `.env` -
# see .env.example) and only bind to 127.0.0.1, not every interface on the
# host - an unauthenticated Mongo/Redis reachable from the LAN/internet is
# one of the most common real-world breach patterns, so neither is safe to
# leave open even in local dev. A real production deployment should go
# further and not publish these ports at all - reachable only from the
# backend/worker over a private network - see README Security section.
#
# Usage: docker compose up -d
# Then run backend/worker/frontend locally with `npm run dev` / `python -m app.main`.
services:
  mongo:
    image: mongo:7
    container_name: ai_task_platform_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ai_task_platform
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/create-app-user.sh:/docker-entrypoint-initdb.d/create-app-user.sh:ro

  redis:
    image: redis:7-alpine
    container_name: ai_task_platform_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
